version: "3.9"

name: netvis-stack

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: net
      CLICKHOUSE_USER: capstone
      CLICKHOUSE_PASSWORD: boogle
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q 'Ok'"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ../db_schema/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - netvis

  netvis:
    image: ubuntu:22.04
    container_name: netvis-dev
    working_dir: /netvis
    stdin_open: true
    tty: true
    depends_on:
      clickhouse:
        condition: service_healthy
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../:/netvis # mounts your entire project
    networks:
      - netvis
    command: [bash, /netvis/docker/netvis-entry.sh]

  zeek:
    image: zeek/zeek:latest
    container_name: zeek
    restart: unless-stopped
    network_mode: "host"
    working_dir: /usr/local/zeek/logs
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../zeek-logs:/usr/local/zeek/logs
      - ../zeek-config/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek
    command: zeek -C -i ens160 local

networks:
  netvis:
    driver: bridge

volumes:
  clickhouse-data:
  clickhouse-logs:

