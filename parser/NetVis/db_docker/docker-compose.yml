#version: "3.9"

name: netvis-stack

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    environment:
      # Creates user and enables access management on first launch
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123" # HTTP (REST/SQL over HTTP)
      - "9000:9000" # Native protocol (clients, drivers)
      # - "9009:9009" # Inter-server (uncomment if you add replicas)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q 'Ok'"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      # Optional: drop custom configs into ./clickhouse/config.d and ./clickhouse/users.d
      #- ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      #- ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    networks:
      - netvis


  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    restart: unless-stopped
    command: >
      sh -c '
        exec valkey-server
          --appendonly no
          --save ""
          --maxmemory ${VALKEY_MAXMEMORY}
          --maxmemory-policy allkeys-lru
          --requirepass "$VALKEY_PASSWORD"
      '
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-512mb}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "PING"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      # Cache-only (no persistence). If you want persistence, set appendonly yes above and keep this volume.
      - valkey-data:/data
    networks:
      - netvis

networks:
  netvis:
    driver: bridge

volumes:
  clickhouse-data:
  clickhouse-logs:
  valkey-data:
