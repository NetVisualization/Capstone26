[package]
name = "pcap2ch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
chrono = { version = "0.4.41", features = ["serde"] }
etherparse = "0.19.0"
hex = "0.4.3"
pcap = "2.3.0"
reqwest = { version = "0.12.23", features = [
    "json",
    "gzip",
    "brotli",
    "deflate",
    "rustls-tls",
] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
urlencoding = "2.1.3"
